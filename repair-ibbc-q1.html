<style>body{font-family:system-ui;background:#101827;color:#fff;padding:24px}button{font-size:18px;padding:12px 20px}pre{white-space:pre-wrap;background:#182235;padding:16px;border-radius:8px}</style>
<h1>IBBC q1 recovery</h1>
<button id="run" disabled>復旧を実行</button>
<pre id="status">認証確認中…</pre>
<script type="module">
import { auth,db,doc,getDoc,serverTimestamp,onAuthStateChanged } from './js/core/firebase.js?v=20260901-scoped-reads-v1';
import { runTransaction } from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js';

const gameId='25c32fe4-ed0e-4bd4-879f-0489d644eb61';
const expectedIds=["85211a23-b469-4251-820a-5c8b525df109","227f94c7-9087-4bd5-9792-14a02a1b5430","89b39d2f-d613-417e-a62e-788dbb71c8b6","ea6fece5-9c5b-4905-b57c-1c2c753195ff","0f502262-c4f4-4592-abf2-0dc717d33986","9226326b-4fee-4c64-8025-52231953b698","45072974-e1cb-41ee-bcee-4048c65f4969","1636f7c5-5807-4b91-a035-326ea73124c4","806b4ede-2a52-4e79-b743-4caa603d252f","fe465ebb-ef92-4ced-b45b-5a7343cb68a6","b6875b75-17bb-4941-9fd6-d7d43222f3c3","069529cd-e450-41ba-bf82-a87fdcc590b9","8a075d75-3e1b-4820-8f46-7319b823a2e8","744e50fd-52e0-42c9-9d8b-8d9c7460e9d1","8e447847-0ef9-47f0-bed1-000882df696f","3aa7c124-872a-4764-9670-2d508ea2a6b6","32dc055e-18c8-4cdc-8121-356641c5814f","47a4e6f2-92a7-4c46-b856-d4adf9c18938","fc3fb2bb-77f5-4cb1-ab95-c102b3e9730b","e4f9d5ea-eb5c-4eff-852a-7ba900b52ab7","5428a766-4022-432a-8aaf-f520b57f0214","2b9616b5-473c-482c-b04d-aebc31d43917","9fcef035-057c-4eec-b61a-8631a35653f9","85382b62-282e-4ac9-8c9b-4b275351b010","ca27fccb-e9a1-4b10-8f8e-58298b0e1436","8a282e09-5dd8-42a4-83c6-54dc6db35dc1","08ae798d-9874-4aa8-8dfb-888815cb35ec","3368b597-dc7d-4aa3-9df8-eff5247a9d91","1c3eda77-e3a6-4cd0-9352-999eafa9a7a7","fad5068f-5591-497b-b720-b9c38e33a272","e38bdfb4-a047-4538-93c0-3496195c70c5","e2107003-2199-47ab-a24b-9a5c7bc17abf","1580b168-d5b5-4583-b95c-f90135b17dd7","5f6c3d30-3995-4b61-8539-5d7405652f17","e147e2ca-9783-4b25-bff0-366509004949"];
const playerIds=['2ac85e91-f5a5-4605-8e78-fd2a6b3ba90e','5b4dbe6a-f4eb-47d6-aa28-776ed72302ab','866b9f0c-c7ef-4464-9a91-920217340c59','id_ddl90cyqi05mqzlzaqt','fe9c0435-c6ea-47a2-9bb7-494736aeb565','0fc7741e-742d-431f-b95e-2239884e46e8','0780f7a1-a883-4f3d-bdc7-b71f110fea71'];
const status=document.querySelector('#status'),button=document.querySelector('#run');
const number=value=>Number(value||0);
function assertGame(game){if(game.opponent!=='IBBC'||game.date!=='2026-04-26'||game.statsRegistrationType!=='quarter'||number(game.quarters)!==4)throw new Error('対象試合の識別情報が一致しません');const ids=(game.playEvents||[]).map(item=>item.id);if(JSON.stringify(ids)!==JSON.stringify(expectedIds))throw new Error('履歴件数または順番がバックアップ時点から変化しています')}
function derive(game,stat){const totals={};for(const event of game.playEvents||[]){if(event.playerId!==stat.playerId)continue;if(event.quarter!=null&&number(event.quarter)!==1)continue;if(event.type==='freeThrow'){totals.fta=number(totals.fta)+number(event.attempts);totals.ftm=number(totals.ftm)+number(event.made);continue}if(!['stat','foul','foulReceived'].includes(event.type))continue;const key=event.type==='foul'?'pf':event.type==='foulReceived'?'fouled':event.statKey;if(key)totals[key]=number(totals[key])+1}const shots=Array.isArray(stat.shots)?stat.shots.filter(shot=>shot.quarter==null||number(shot.quarter)===1):[];if(shots.length){totals.shots=shots;totals.twoPa=shots.filter(s=>!String(s.shotArea||'').includes('3p')).length;totals.twoPm=shots.filter(s=>!String(s.shotArea||'').includes('3p')&&s.result==='made').length;totals.threePa=shots.filter(s=>String(s.shotArea||'').includes('3p')).length;totals.threePm=shots.filter(s=>String(s.shotArea||'').includes('3p')&&s.result==='made').length;totals.shotInputMode=stat.shotInputMode||'detailed';totals.shotTrackingMode=stat.shotTrackingMode||'detailed';totals.shotFouledCount=shots.filter(s=>s.fouled||s.isFouled||s.receivedFoul).length}return totals}
function nextQuarters(stat,derived){const quarters=stat.quarters&&typeof stat.quarters==='object'&&!Array.isArray(stat.quarters)?{...stat.quarters}:{};const old=quarters.q1&&typeof quarters.q1==='object'?quarters.q1:{};const q1={...old};for(const [key,value] of Object.entries(derived))q1[key]=key==='shots'?value:(typeof value==='number'?Math.max(number(old[key]),value):value);q1.registered=true;q1.quarter=1;quarters.q1=q1;return quarters}
onAuthStateChanged(auth,user=>{status.textContent=user?'管理者認証済み。実行できます。':'未ログインです。R32本体でログインしてください。';button.disabled=!user});
button.onclick=async()=>{button.disabled=true;status.textContent='復旧中…';try{const summary=await runTransaction(db,async tx=>{const gameRef=doc(db,'games',gameId),statRefs=playerIds.map(id=>doc(db,'stats',`${gameId}_${id}`));const [gameSnap,...statSnaps]=await Promise.all([tx.get(gameRef),...statRefs.map(ref=>tx.get(ref))]);if(!gameSnap.exists())throw new Error('対象gameがありません');const game=gameSnap.data();assertGame(game);if((game.playEvents||[]).some(event=>event.quarter!=null&&number(event.quarter)!==1))throw new Error('1Q以外の履歴が含まれています');const playEvents=(game.playEvents||[]).map(event=>event.quarter==null?{...event,quarter:1}:event);const updated=[];for(let i=0;i<statRefs.length;i++){if(!statSnaps[i].exists())throw new Error(`stats欠落: ${playerIds[i]}`);const stat=statSnaps[i].data(),derived=derive(game,stat),quarters=nextQuarters(stat,derived);tx.set(statRefs[i],{quarters,updatedAt:serverTimestamp()},{merge:true});updated.push({playerId:playerIds[i],q1:quarters.q1})}tx.set(gameRef,{playEvents,updatedAt:serverTimestamp()},{merge:true});return {eventIds:playEvents.map(e=>e.id),updated}});const verifyGame=(await getDoc(doc(db,'games',gameId))).data();assertGame(verifyGame);if((verifyGame.playEvents||[]).some(event=>number(event.quarter)!==1))throw new Error('履歴のQ補完検証に失敗しました');const verification=[];for(const playerId of playerIds){const stat=(await getDoc(doc(db,'stats',`${gameId}_${playerId}`))).data(),q1=stat.quarters?.q1;if(!q1?.registered||number(q1.quarter)!==1)throw new Error(`q1検証失敗: ${playerId}`);verification.push({playerId,q1:{...q1,shots:q1.shots?.map(s=>s.id)}})}status.textContent=JSON.stringify({ok:true,eventCount:verifyGame.playEvents.length,eventOrderUnchanged:JSON.stringify(summary.eventIds)===JSON.stringify(expectedIds),allEventsQuarter1:true,updatedPlayers:verification},null,2)}catch(error){status.textContent=`ERROR: ${error.message}`;button.disabled=false}};
</script>
