name: Temporary Nara import tests
on:
  push:
    branches: [agent/nara-history-20260916]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check js/app.js
      - run: node --test tests/nara-history-import.test.mjs tests/nara-history-menu-contract.test.mjs
