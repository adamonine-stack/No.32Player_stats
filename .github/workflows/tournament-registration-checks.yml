name: Tournament registration checks

on:
  push:
    branches: [main]
    paths:
      - 'js/app.js'
      - 'js/calculations/game-registration-calculations.js'
      - 'js/calculations/tournament-registration-calculations.js'
      - 'tests/game-registration.test.mjs'
      - 'tests/mobile-landscape-stats.test.mjs'
      - 'styles/mobile-landscape-stats.css'
      - 'tests/tournament-registration.test.mjs'
      - 'tests/2026-kinki-official-results.test.mjs'
      - 'js/data/2026-kinki-jwc-all-teams-men.js'
      - 'js/data/2026-kinki-jwc-soutai-results-men.js'
      - 'js/core/verified-kinki-import.js'
      - 'js/data/2026-cbg-hyogo-men.js'
      - 'js/data/2026-osaka-u15-men.js'
      - 'js/data/2026-nara-u15-men.js'
      - 'js/data/2025-2026-kyoto-history-men.js'
  pull_request:
    paths:
      - 'js/app.js'
      - 'js/calculations/game-registration-calculations.js'
      - 'js/calculations/tournament-registration-calculations.js'
      - 'tests/game-registration.test.mjs'
      - 'tests/mobile-landscape-stats.test.mjs'
      - 'styles/mobile-landscape-stats.css'
      - 'tests/tournament-registration.test.mjs'
      - 'tests/2026-kinki-official-results.test.mjs'
      - 'js/data/2026-kinki-jwc-all-teams-men.js'
      - 'js/data/2026-kinki-jwc-soutai-results-men.js'
      - 'js/core/verified-kinki-import.js'
      - 'js/data/2026-cbg-hyogo-men.js'
      - 'js/data/2026-osaka-u15-men.js'
      - 'js/data/2026-nara-u15-men.js'
      - 'js/data/2025-2026-kyoto-history-men.js'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check js/app.js
          node --check js/core/verified-kinki-import.js
          node --check js/data/2026-kinki-jwc-all-teams-men.js
      - name: Test tournament and game registration
        run: node --test tests/game-registration.test.mjs tests/tournament-registration.test.mjs tests/2026-kinki-official-results.test.mjs tests/mobile-landscape-stats.test.mjs
