name: starter-sync-tests
on:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/starter-save-dedupe.test.mjs tests/offline-journal-sync.test.mjs tests/quarter-session-idb.test.mjs tests/participation-ui-contract.test.mjs tests/game-delete-offline-contract.test.mjs tests/offline-registration-contract.test.mjs
